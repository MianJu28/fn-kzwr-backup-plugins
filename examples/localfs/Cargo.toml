[package]
name = "fn-kzwr-plugin-example-localfs"
version = "1.0.0"
edition = "2021"
publish = false
description = "酷族备份 · 外置插件示例：本地目录备份目标（稳定 C ABI 目标能力表）"

[lib]
name = "fn_kzwr_plugin_example_localfs"
# 外置插件必须编译为动态库（宿主用 libloading 加载 *.so）
crate-type = ["cdylib"]

[dependencies]
# 只依赖**稳定契约** SDK（零第三方依赖），不依赖宿主 crate
# → 宿主升级后本插件无需重新编译（只要 ABI v1 不变）
fn-kzwr-plugin-sdk = { path = "../../sdk" }
serde_json = "1"
